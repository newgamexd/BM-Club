<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html,body{
    margin:0;
    padding:0;
    background:transparent;
    overflow:hidden;
}

#members{
    display:inline-block;
    background:#1f1f1f;
    color:white;
    padding:5px 10px;
    border-radius:8px;
    font-family:Arial;
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
}
</style>
</head>

<body>

<div id="members">Loading...</div>

<script>
async function loadMembers() {

    try {

        const response = await fetch(
            "https://api.chess.com/pub/club/blunder-master-vn"
        );

        const data = await response.json();

        document.getElementById("members").innerHTML =
            "👥 " + data.members_count;

    } catch (e) {

        document.getElementById("members").innerHTML =
            "Error";

    }
}

loadMembers();

setInterval(loadMembers,15000);
</script>

</body>
</html>
