<script>

const goals = [100,200,500,1000,1500,2000,2500];

// dùng proxy để bypass CORS
const API = "https://api.allorigins.win/raw?url=https://api.chess.com/pub/club/blunder-master-vn/members";

async function loadMembers(){
    try{
        const res = await fetch(API);
        const data = await res.json();

        // Chess.com trả về: weekly/monthly/all_time
        const list = data.all_time || [];

        let currentMembers = list.length;

        // tìm mốc
        let prev = 0;
        let next = goals[goals.length - 1];

        for(let g of goals){
            if(currentMembers < g){
                next = g;
                break;
            }
            prev = g;
        }

        let percent = ((currentMembers - prev) / (next - prev)) * 100;
        percent = Math.max(0, Math.min(100, percent));

        document.getElementById("bar").style.width = percent + "%";
        document.getElementById("text").innerHTML =
            `👥 ${currentMembers} thành viên (mục tiêu: ${next})`;

        const latest = list.slice(-3).reverse();

        document.getElementById("members").innerHTML =
            latest.map(m => `<div>• ${m.username}</div>`).join("");

    }catch(err){
        console.log(err);
        document.getElementById("members").innerHTML =
            "❌ Không load được API (CORS hoặc mạng)";
    }
}

loadMembers();
setInterval(loadMembers, 30000);

</script>
