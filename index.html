<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BM Club Progress</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

#box{
    width:320px;
    background:#1f1f1f;
    padding:20px;
    border-radius:15px;
}

#members{
    font-size:20px;
    margin-bottom:10px;
}

#goal{
    margin-bottom:10px;
}

#barbg{
    width:100%;
    height:22px;
    background:#333;
    border-radius:999px;
    overflow:hidden;
}

#bar{
    height:100%;
    width:0%;
    background:limegreen;
}

#percent{
    margin-top:10px;
    font-size:16px;
}
</style>
</head>

<body>

<div id="box">

<div id="members">
Loading...
</div>

<div id="goal">
Goal: ...
</div>

<div id="barbg">
    <div id="bar"></div>
</div>

<div id="percent">
0 / 100
</div>

</div>

<script>

const goals = [100,200,500,1000,1500,2000,2500];

async function updateProgress(){

    try{

        const r = await fetch(
            "https://api.chess.com/pub/club/blunder-master-vn"
        );

        const data = await r.json();

        const members = data.members_count;

        document.getElementById("members").innerHTML =
            "👥 " + members + " members";

        let goal = goals[goals.length - 1];
        let previous = 0;

        for(let i = 0; i < goals.length; i++){

            if(members < goals[i]){

                goal = goals[i];

                if(i > 0){
                    previous = goals[i - 1];
                }

                break;
            }
        }

        const currentProgress = members - previous;
        const totalNeeded = goal - previous;

        const percent =
            (currentProgress / totalNeeded) * 100;

        document.getElementById("goal").innerHTML =
            "Goal: " + goal;

        document.getElementById("bar").style.width =
            percent + "%";

        document.getElementById("percent").innerHTML =
            currentProgress + " / " + totalNeeded;

    }catch(e){

        document.getElementById("members").innerHTML =
            "Error";

    }
}

updateProgress();

setInterval(updateProgress,15000);

</script>

</body>
</html>
