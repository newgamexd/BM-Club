
<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }

        .vortex-container {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: #ffffff;
            width: 202px;
            max-width: 300px; /* Adjust based on your sidebar width */
        }

        .vortex-card {
  width: 202px;
  height: 75px;
  background: linear-gradient(180deg,#2b0000,#120000);
  color: #ffffff;
  border-radius: 18px;
  padding: 12px;
  border: 1px solid rgba(255,70,70,.35);
  border-top: 2px solid rgba(255,90,90,.8);
  box-shadow: 0 0 12px rgba(255,0,0,.15);
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-family: "Helvetica", Arial, sans-serif;
            font-size: 16px;
        }

        .spacer {
            height: 12px;
        }

        /* Progress Bar Styles */
        .progress-track {
            position: relative;
            height: 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            border: 1px solid rgba(54, 160, 235, 0.3);
            margin-bottom: 8px;
        }

.progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg,#ff2b2b,#ff5e00);
    box-shadow: 0 0 12px rgba(255,60,60,.6);
    transition: width 1.5s cubic-bezier(0.4,0,0.2,1);
}
.blue-text { color: #ff6666; }
.green-text { color: #ffb347; }
    </style>
</head>
<body>

    <div class="vortex-container">
        <div class="vortex-card">
            <div class="flex-row">
                <strong>Thành Viên</strong>
                <span>
                    <strong class="blue-text" id="current-count">...</strong><strong> / </strong><strong class="green-text">500</strong>
                    </span>
            </div>

            <div class="spacer"></div>

            <div class="progress-track">
                <div id="progress-bar" class="progress-fill"></div>
                <div class="target-dot"></div>
            </div>
<div class="flex-row">
    <strong class="blue-text">0</strong>
    <strong id="percent" style="color:#ffffff">0%</strong>
    <strong class="green-text">500</strong>
</div>
    </div>

    <script>
        async function updateVortexProgress() {
            const clubSlug = 'blunder-master-vn';
            const goal = 500;
            
            const currentCountEl = document.getElementById('current-count');
            const progressBarEl = document.getElementById('progress-bar');

            try {
                // Fetch live club data from Chess.com Public API
                const response = await fetch(`https://api.chess.com/pub/club/${clubSlug}`, {
                    headers: { 'User-Agent': 'VortexProgressBot/1.0 (contact: your-email@example.com)' }
                });
                
                if (!response.ok) throw new Error('API Error');
                
                const data = await response.json();
                const count = data.members_count;

                // 1. Update the number text
                currentCountEl.innerText = count.toLocaleString();

                // 2. Calculate percentage
                let percentage = (count / goal) * 100;
                
                // Cap at 100% so it doesn't break the UI
                if (percentage > 100) percentage = 100;
                if (percentage < 0) percentage = 0;

                // 3. Update the bar width (triggers the CSS transition)
                progressBarEl.style.width = percentage + '%';
                document.getElementById("percent").innerText =
    percentage.toFixed(1) + "%";

            } catch (error) {
                console.error("Failed to load member count:", error);
                currentCountEl.innerText = "Error";
            }
        }

        // Initialize
        updateVortexProgress();
    </script>

</body>
</html>
