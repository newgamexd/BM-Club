<script>

const GOAL = 500;
const API = "https://api.chess.com/pub/club/blunder-master-vn/members";

async function load(){

    try{
        const res = await fetch(API);
        const data = await res.json();

        const list = data.all_time || [];
        const count = list.length;

        // lưu snapshot ổn định
        localStorage.setItem("club_count", count);

        document.getElementById("text").innerHTML =
            `👥 ${count} / ${GOAL}`;

        document.getElementById("bar").style.width =
            Math.min(100, (count/GOAL)*100) + "%";

    }catch(e){

        // nếu API lỗi → dùng dữ liệu đã lưu
        const cached = localStorage.getItem("club_count") || 0;

        document.getElementById("text").innerHTML =
            `👥 ${cached} / ${GOAL} (cache)`;

        document.getElementById("bar").style.width =
            Math.min(100, (cached/GOAL)*100) + "%";
    }
}

load();
setInterval(load, 60000);

</script>
