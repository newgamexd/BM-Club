<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>CLB Progress</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    padding:20px;
}

.progress-box{
    width:100%;
    height:22px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0;
}

.bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00ffcc,#0066ff);
    transition:0.4s;
}

#text{
    margin-top:10px;
}
</style>
</head>

<body>

<h2>📊 CLB Progress</h2>

<div class="progress-box">
    <div class="bar" id="bar"></div>
</div>

<div id="text">Đang tải...</div>

<script>

const GOAL = 500;
const API = "https://api.chess.com/pub/club/blunder-master-vn/members";

function percent(count){
    return Math.max(0, Math.min(100, (count / GOAL) * 100));
}

async function load(){

    try{
        const res = await fetch(API);
        const data = await res.json();

        // ✅ CHỈ DÙNG 1 NGUỒN DUY NHẤT (quan trọng)
        const count = (data.all_time || []).length;

        const p = percent(count);

        document.getElementById("bar").style.width = p + "%";
        document.getElementById("text").innerHTML =
            `👥 ${count} / ${GOAL} thành viên • ${p.toFixed(1)}%`;

    }catch(e){
        console.log(e);
        document.getElementById("text").innerHTML =
            "❌ Lỗi tải dữ liệu API";
    }
}

load();
setInterval(load, 60000);

</script>

</body>
</html>
