<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>CLB Progress</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    padding:20px;
}

h2{color:#00ffcc}

.progress-box{
    width:100%;
    height:22px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0;
}

.bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00ffcc,#0066ff);
    transition:0.4s;
}

#text{
    margin-top:10px;
}
</style>
</head>

<body>

<h2>📊 Tiến trình CLB</h2>

<div class="progress-box">
    <div class="bar" id="bar"></div>
</div>

<div id="text">Đang tải...</div>

<script>

const GOAL = 500;
const API = "https://api.chess.com/pub/club/blunder-master-vn/members";

function calcPercent(count){
    let percent = (count / GOAL) * 100;
    return Math.max(0, Math.min(100, percent));
}

async function load(){

    try{
        document.getElementById("text").innerHTML = "⏳ Đang tải...";

        const res = await fetch(API);
        const data = await res.json();

        const list = data.all_time || [];
        const count = list.length;

        const percent = calcPercent(count);

        document.getElementById("bar").style.width = percent + "%";

        document.getElementById("text").innerHTML =
            `👥 ${count} / ${GOAL} thành viên • ${percent.toFixed(1)}%`;

    }catch(e){
        console.log(e);
        document.getElementById("text").innerHTML =
            "❌ Không load được dữ liệu";
    }
}

load();
setInterval(load, 60000);

</script>

</body>
</html>
