<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html,body{
    margin:0;
    padding:0;
    background:transparent;
    overflow:hidden;
}

#box{
    display:inline-block;
    padding:6px 10px;
    background:#1f1f1f;
    color:white;
    border-radius:10px;
    font-family:Arial;
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
}
</style>
</head>

<body>

<div id="box">👥 Loading...</div>

<script>
async function load() {

    const r = await fetch(
        "https://api.chess.com/pub/club/blunder-master-vn"
    );

    const d = await r.json();

    const members = d.members_count;

    // Lấy số hôm qua
    let yesterday = localStorage.getItem("yesterday_members");
    let lastDate = localStorage.getItem("saved_date");

    // Ngày hiện tại
    const today = new Date().toDateString();

    // Nếu sang ngày mới thì lưu số cũ
    if(lastDate !== today){

        localStorage.setItem("yesterday_members", members);
        localStorage.setItem("saved_date", today);

        yesterday = members;
    }

    yesterday = Number(yesterday || members);

    const diff = members - yesterday;

    let text = "";

    if(diff > 0){
        text = `📈 +${diff}`;
    }
    else if(diff < 0){
        text = `📉 ${diff}`;
    }
    else{
        text = `➖ 0`;
    }

    document.getElementById("box").innerHTML =
        `👥 ${members} | ${text}`;
}

load();

setInterval(load,15000);
</script>

</body>
</html></html>
