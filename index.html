<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>CLB Progress</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    padding:20px;
}

.progress-box{
    width:100%;
    height:22px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0;
}

.bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00ffcc,#0066ff);
    transition:0.5s;
}

#members{
    margin-top:20px;
    background:#222;
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<h2>📊 Thành viên CLB</h2>

<div class="progress-box">
    <div class="bar" id="bar"></div>
</div>

<div id="text">Đang tải...</div>

<h3>♟ 3 thành viên mới nhất</h3>
<div id="members"></div>

<script>

const goals = [100,200,500,1000,1500,2000,2500];

const API = "https://api.chess.com/pub/club/blunder-master-vn/members";

async function load(){

    try{
        const res = await fetch(API);
        const data = await res.json();

        const list = data.all_time || [];
        const count = list.length;

        // tìm mốc gần nhất
        let prev = 0;
        let next = goals[goals.length - 1];

        for(let g of goals){
            if(count < g){
                next = g;
                break;
            }
            prev = g;
        }

        let percent = ((count - prev) / (next - prev)) * 100;
        percent = Math.max(0, Math.min(100, percent));

        // update UI
        document.getElementById("bar").style.width = percent + "%";
        document.getElementById("text").innerHTML =
            `👥 ${count} thành viên (mục tiêu: ${next})`;

        const latest = list.slice(-3).reverse();

        document.getElementById("members").innerHTML =
            latest.map(m => "• " + m.username).join("<br>");

    }catch(e){
        console.log(e);
        document.getElementById("text").innerHTML =
            "❌ Không load được API";
    }
}

load();

setInterval(load, 60000);

</script>

</body>
</html>
