<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

#box{
    width:320px;
    background:#1f1f1f;
    padding:20px;
    border-radius:15px;
}

#barbg{
    width:100%;
    height:20px;
    background:#333;
    border-radius:999px;
    overflow:hidden;
}

#bar{
    height:100%;
    width:0%;
    background:limegreen;
}
</style>
</head>

<body>

<div id="box">

<div id="members">Loading...</div>
<div>Goal: <span id="goal">...</span></div>

<div id="barbg">
    <div id="bar"></div>
</div>

<div id="percent">0%</div>

</div>

<script>

const goals = [100,200,500,1000,1500,2000,2500];

async function updateProgress(){

    try{

        // 🔥 FIX CORS HERE
        const r = await fetch(
            "https://api.allorigins.win/raw?url=https://api.chess.com/pub/club/blunder-master-vn"
        );

        const data = await r.json();

        const members = data.members_count;

        document.getElementById("members").innerHTML =
            "👥 " + members + " members";

        let goal = goals[goals.length - 1];
        let prev = 0;

        for(let i=0;i<goals.length;i++){
            if(members < goals[i]){
                goal = goals[i];
                prev = i>0 ? goals[i-1] : 0;
                break;
            }
        }

        const percent = ((members - prev)/(goal - prev))*100;

        document.getElementById("goal").innerText = goal;
        document.getElementById("bar").style.width = percent + "%";
        document.getElementById("percent").innerText = Math.floor(percent) + "%";

    }catch(e){
        document.getElementById("members").innerText = "Error loading API";
        console.log(e);
    }
}

updateProgress();
setInterval(updateProgress,15000);

</script>

</body>
</html>
